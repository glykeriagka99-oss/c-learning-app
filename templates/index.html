<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <title>Μάθε C με Microlearning</title>

    <style>

        /* Βασική εμφάνιση της σελίδας */
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF8DC;
            margin: 0;
            color: #333;
        }

        /* Κεντρικό περιεχόμενο */
        .container {
            max-width: 850px;
            margin: 70px auto;
            padding: 40px;
            text-align: center;
        }

        /* Κεντρική κάρτα */
        .hero {
            background-color: #FFFDF3;
            border: 2px solid #F2D675;
            border-radius: 25px;
            padding: 55px 40px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.10);
        }

        /* Εικονίδια αρχικής σελίδας */
        .icon {
            font-size: 65px;
            margin-bottom: 10px;
        }

        h1 {
            color: #5D4037;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 19px;
            line-height: 1.6;
            color: #666;
            max-width: 650px;
            margin: 0 auto 30px;
        }

        /* Μικρές πληροφορίες για την εφαρμογή */
        .features {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .feature {
            background-color: #FFF3BF;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 15px;
            color: #5D4037;
        }

        /* Κουμπί έναρξης */
        .start-button {
            display: inline-block;
            background-color: #E5B93F;
            color: #3E2F20;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        /* Αλλαγή εμφάνισης όταν περνάει το ποντίκι */
        .start-button:hover {
            background-color: #D4A72C;
            transform: translateY(-2px);
        }

        .message {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

    </style>
</head>


<body>

<!-- Κεντρική περιοχή της αρχικής σελίδας -->
<div class="container">

    <div class="hero">

        <div class="icon">💻🌱</div>

        <h1>Μάθε C με Microlearning</h1>

        <p class="subtitle">
            Μάθε τη γλώσσα προγραμματισμού C βήμα-βήμα,
            μέσα από μικρά μαθήματα, παραδείγματα και
            διαδραστικές ερωτήσεις.
        </p>


        <!-- Βασικά χαρακτηριστικά της εφαρμογής -->
        <div class="features">

            <div class="feature">
                ⏱️ Μικρά μαθήματα
            </div>

            <div class="feature">
                🧠 Διαδραστικά Quiz
            </div>

            <div class="feature">
                🚀 Βήμα-βήμα
            </div>

        </div>


        <!-- Μετάβαση στο Skill Tree -->
        <a class="start-button" href="/skills">
            Ξεκίνα την εκμάθηση 🚀
        </a>

        <p class="message">
            Δεν χρειάζεται προηγούμενη εμπειρία στον προγραμματισμό.
        </p>

    </div>

</div>

</body>

</html>
